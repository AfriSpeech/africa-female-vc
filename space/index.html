<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Africa Female VC</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1c1b19; --muted: #6e6a64; --line: #e4e0da;
    --accent: #1f5f5b; --accent-ink: #ffffff; --soft: #eef4f3; --warn-bg: #fdf3e2; --warn-ink: #6f4708; --err-ink: #9b2c1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1d1c1a; --ink: #eeebe6; --muted: #a29d96; --line: #33312e;
      --accent: #5fb3ab; --accent-ink: #0d1615; --soft: #1c2928; --warn-bg: #33280f; --warn-ink: #f0cf8c; --err-ink: #f0a090;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --card: #1d1c1a; --ink: #eeebe6; --muted: #a29d96; --line: #33312e;
    --accent: #5fb3ab; --accent-ink: #0d1615; --soft: #1c2928; --warn-bg: #33280f; --warn-ink: #f0cf8c; --err-ink: #f0a090;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 6px; }
  .intro { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .field + .field { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
  .label { display: block; font-size: .78rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .btn:hover { border-color: var(--muted); }
  .btn.rec { color: var(--err-ink); }
  .btn.primary { width: 100%; padding: 13px; background: var(--accent); color: var(--accent-ink); border: 0; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn.icon { padding: 10px 14px; }
  input[type=file] { display: none; }
  select { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  audio { width: 100%; margin-top: 12px; display: block; }
  .desc { color: var(--muted); font-size: .88rem; margin: 8px 0 0; }
  .status { margin-top: 16px; border-radius: 10px; padding: 11px 14px; font-size: .92rem; background: var(--soft); }
  .status.warm { background: var(--warn-bg); color: var(--warn-ink); }
  .status.err { background: var(--warn-bg); color: var(--err-ink); }
  .result { margin-top: 16px; }
  .result a { color: var(--accent); font-weight: 600; font-size: .92rem; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Africa Female VC</h1>
  <p class="intro">Turn speech in any language into one of 21 African female voices. The words stay the same; only the voice changes.</p>

  <div class="card">
    <div class="field">
      <span class="label">1 · Your audio</span>
      <div class="row">
        <button id="recBtn" class="btn rec" type="button">● Record</button>
        <label class="btn" for="fileIn">Upload file</label>
        <input id="fileIn" type="file" accept="audio/*">
      </div>
      <audio id="srcAudio" controls hidden></audio>
      <p class="desc">Up to 30 seconds.</p>
    </div>

    <div class="field">
      <label class="label" for="voiceSel">2 · Voice</label>
      <div class="row">
        <select id="voiceSel"></select>
        <button id="previewBtn" class="btn icon" type="button" aria-label="Preview voice" title="Preview voice">▶</button>
      </div>
      <p id="voiceDesc" class="desc"></p>
    </div>

    <div class="field">
      <button id="convertBtn" class="btn primary" type="button" disabled>Convert</button>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="result" class="result" hidden>
        <audio id="outAudio" controls></audio>
        <p><a id="dlLink" download="converted.wav">Download</a></p>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://huggingface.co/AfriSpeech/africa-female-vc" target="_blank" rel="noopener">Model</a> ·
    <a href="https://github.com/AfriSpeech/africa-female-vc" target="_blank" rel="noopener">GitHub</a> ·
    <a href="https://huggingface.co/datasets/AfriSpeech/africa-female-speech-v2-best60" target="_blank" rel="noopener">Data</a>
  </footer>
</main>

<script>
const API = "https://michsethowusuwfp--africa-female-vc-converter-api.modal.run";
const DEFAULT_VOICE = "clear-high-slow";

const $ = (id) => document.getElementById(id);
let voices = {};
let srcBlob = null;
let serverReady = false;
let waking = null;   // in-flight /health request

function showStatus(kind, text) {
  const el = $("status");
  el.className = "status" + (kind ? " " + kind : "");
  el.textContent = text;
  el.hidden = false;
}
function hideStatus() { $("status").hidden = true; }

// The GPU server scales to zero when idle; the first request after a quiet
// spell boots it (cold start), which takes far longer than a conversion.
// Ping on page load so it is usually awake by the time someone clicks Convert,
// and say so when a cold start is what the user is waiting on.
function wakeServer() {
  if (serverReady) return Promise.resolve(true);
  if (!waking) {
    waking = fetch(API + "/health", { cache: "no-store" })
      .then((r) => { serverReady = r.ok; return r.ok; })
      .catch(() => false)
      .finally(() => { waking = null; });
  }
  return waking;
}

async function loadVoices() {
  voices = await (await fetch("voices/voices.json")).json();
  const sel = $("voiceSel");
  Object.keys(voices).sort().forEach((id) => {
    const o = document.createElement("option");
    o.value = id;
    o.textContent = id;
    sel.appendChild(o);
  });
  sel.value = voices[DEFAULT_VOICE] ? DEFAULT_VOICE : sel.options[0].value;
  showVoice();
}

function showVoice() {
  const m = voices[$("voiceSel").value];
  const d = m.description.charAt(0).toUpperCase() + m.description.slice(1);
  $("voiceDesc").textContent = `${d}. Recorded in ${m.recorded_in}.`;
}

const preview = new Audio();
$("voiceSel").onchange = () => { preview.pause(); showVoice(); };
$("previewBtn").onclick = () => {
  preview.src = "voices/" + voices[$("voiceSel").value].file;
  preview.play();
};

function setSource(blob) {
  srcBlob = blob;
  const a = $("srcAudio");
  a.src = URL.createObjectURL(blob);
  a.hidden = false;
  $("convertBtn").disabled = false;
  $("result").hidden = true;
  hideStatus();
}

$("fileIn").onchange = (e) => { if (e.target.files[0]) setSource(e.target.files[0]); };

let recorder = null;
$("recBtn").onclick = async (e) => {
  const btn = e.currentTarget;
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (ev) => chunks.push(ev.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      btn.textContent = "● Record";
      setSource(new Blob(chunks, { type: recorder.mimeType }));
    };
    recorder.start();
    btn.textContent = "■ Stop";
    setTimeout(() => recorder.state === "recording" && recorder.stop(), 30000);
  } catch (err) {
    showStatus("err", "Microphone unavailable. You can upload a file instead.");
  }
};

$("convertBtn").onclick = async () => {
  const btn = $("convertBtn");
  btn.disabled = true;
  $("result").hidden = true;
  const t0 = Date.now();
  const tick = () => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (serverReady) showStatus("", `Converting… ${s}s`);
    else showStatus("warm", `Starting the GPU server (it sleeps when idle) - ${s}s. The first request takes about 1-2 minutes; after that, conversions take seconds.`);
  };
  tick();
  const timer = setInterval(tick, 1000);
  try {
    if (!serverReady && !(await wakeServer())) throw new Error("the server could not be reached");
    const fd = new FormData();
    fd.append("file", srcBlob, "input");
    fd.append("voice", $("voiceSel").value);
    const r = await fetch(API + "/convert", { method: "POST", body: fd });
    if (!r.ok) {
      let msg = "error " + r.status;
      try { msg = (await r.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const url = URL.createObjectURL(await r.blob());
    $("outAudio").src = url;
    $("dlLink").href = url;
    $("dlLink").download = `converted_${$("voiceSel").value}.wav`;
    $("result").hidden = false;
    hideStatus();
  } catch (err) {
    showStatus("err", "Conversion failed: " + err.message + ". Please try again.");
  } finally {
    clearInterval(timer);
    btn.disabled = false;
  }
};

loadVoices();
wakeServer();
</script>
</body>
</html>
